# Optional: Render Blueprint — Dashboard se bhi same settings kar sakte ho.
# New → Cron Job → connect repo, Root Directory: db-keepalive

services:
  - type: cron
    name: insightflow-db-keepalive
    runtime: python
    rootDir: db-keepalive
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DATABASE_URL
        sync: false
