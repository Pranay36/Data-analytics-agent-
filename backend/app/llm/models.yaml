# Which structured-output strategies each model is known to handle, in the order
# the client tries them. Matched with shell-style wildcards against
# "provider:model"; the first matching entry wins, otherwise `default` applies.
#
# This is data, not code: free-tier models appear and vanish constantly, and
# re-testing one should mean editing a line here.
#
# Every entry below was measured, not assumed. A probe asked each model to write
# a query in each mode, then ran the SQL through the guard and executed it.
# Re-run it with:   uv run python -m app.scripts.check_models

default: [tool_call, prompt_json]

models:
  "openrouter:nvidia/nemotron-3-super-120b-a12b:free": [tool_call, json_schema, prompt_json]
  "openrouter:qwen/qwen3.8-27b:free":                  [tool_call, json_schema, prompt_json]
  "groq:openai/gpt-oss-120b":                          [tool_call, json_schema, prompt_json]
  "groq:openai/gpt-oss-20b":                           [tool_call, json_schema, prompt_json]

  # Observed: HTTP 400 "Failed to generate JSON" in json_schema mode.
  "groq:qwen/qwen3.8-27b":                             [tool_call, prompt_json]

  # An auto-router: it picks a model per request, so output varies between
  # calls (plain text instead of JSON once, a 39s reply another time).
  # Kept out of the default chain; listed so it behaves sensibly if chosen.
  "openrouter:openrouter/free":                        [tool_call, prompt_json]
