# Which models InsightFlow uses, and where they come from.
#
# Everything here is a default that an environment variable can override, so the
# app runs with no configuration at all but nothing is hardcoded in Python.
# Free-tier models are withdrawn and renamed constantly, which is exactly why
# this is data you can edit rather than code you have to change.
#
# Check what currently works:
#   uv run python -m app.scripts.check_models --probe
#   uv run python -m app.scripts.eval_retrieval

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    # 1,000 requests/day, but only ~8,000 tokens/minute — the token budget binds
    # first on prompts carrying retrieved context.
    daily_requests: 1000

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    # 50 requests/day on the free tier, shared between chat and embeddings.
    # Scarce enough that it is reserved for embeddings; see `llm.chain`.
    daily_requests: 50
    headers:
      X-Title: InsightFlow

  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY

  ollama:
    # Local models: unlimited and offline, but you must run `ollama serve`.
    base_url: http://localhost:11434/v1
    api_key_env: null

llm:
  # Tried in order. Groq leads deliberately: it allows 1,000 requests a day
  # against OpenRouter's 50, and those 50 are needed for embeddings. Putting
  # OpenRouter first drained the shared daily allowance on chat alone.
  chain:
    - groq:openai/gpt-oss-120b
    - openrouter:nvidia/nemotron-3-super-120b-a12b:free
    - openrouter:qwen/qwen3.8-27b:free

  # Optional per-agent override, tried ahead of the chain. Give the strongest
  # model to `query`, where SQL correctness is decided.
  agents:
    query: null
    # The analyst interprets statistics that were already computed, so it does not need
    # the strongest model, and it runs once per drill-down level alongside the Query
    # Agent. Sharing one Groq model (8,000 tokens a minute) meant a full investigation
    # took nearly four minutes of rate-limit waiting. Gemini has its own quota.
    # `-latest` aliases are used because dated Gemini models are withdrawn without notice.
    analysis: gemini:gemini-flash-lite-latest
    # Presenting results is the lightest of the three jobs, and it shares the analyst's
    # separate Gemini quota rather than the Groq tokens-per-minute the Query Agent needs.
    visualization: gemini:gemini-flash-lite-latest

  # How to ask each model for machine-readable output, in order of preference.
  # Measured, not assumed: a probe asked each model to write a query in each
  # mode, then ran the SQL through the guard and executed it. Tool calling
  # worked on all five models tried; JSON-schema mode failed on two.
  capabilities:
    default: [tool_call, prompt_json]

    models:
      "groq:openai/gpt-oss-120b": [tool_call, json_schema, prompt_json]
      "groq:openai/gpt-oss-20b": [tool_call, json_schema, prompt_json]
      # Tool calling answered 3 of 3 probes in about 1.5s. Its sibling gemini-flash-latest
      # returned HTTP 503 "high demand" on 2 of 3, so avoid that alias.
      "gemini:gemini-flash-lite-latest": [tool_call, prompt_json]
      "gemini:gemini-3.5-flash-lite": [tool_call, prompt_json]
      "openrouter:nvidia/nemotron-3-super-120b-a12b:free": [tool_call, json_schema, prompt_json]
      "openrouter:qwen/qwen3.8-27b:free": [tool_call, json_schema, prompt_json]

      # Returns HTTP 400 "Failed to generate JSON" in json_schema mode.
      "groq:qwen/qwen3.8-27b": [tool_call, prompt_json]

      # An auto-router: it picks a model per request, so the same prompt can
      # return plain text once and JSON the next time. Avoid in the chain.
      "openrouter:openrouter/free": [tool_call, prompt_json]

embeddings:
  default: gemini:gemini-embedding-2

  # `dimension` must match the stored vector column. Changing to a model of a
  # different width needs a migration and a full re-index, because vectors from
  # different models cannot be compared — a mixed index returns nonsense rather
  # than failing.
  models:
    "gemini:gemini-embedding-2":
      dimension: 1024
      request_dimensions: true
      notes: >-
        In use. Natively 3072 dimensions, which exceeds pgvector's 2,000-dimension
        limit for HNSW indexes, so a 1024-wide vector is requested explicitly. The
        model supports this directly and still returns a unit vector, so no
        re-normalising is needed and the existing column and index are unchanged.
        Chosen because OpenRouter's free tier allows only 50 requests a day across
        chat and embeddings combined, which one re-index plus one evaluation run
        exhausts.

    "openrouter:liquid/lfm-2.5-embedding-350m:free":
      dimension: 1024
      notes: >-
        Previously in use. Retrieved every needed table across a 21-question set, and never
        ranked the decoy archive above the real orders table. Scores are
        compressed (a correct table lands near 0.2), which is why filtering is
        relative to the best match rather than an absolute threshold.

    "openrouter:nvidia/nemotron-3-embed-1b:free":
      dimension: 2048
      notes: >-
        Scored marginally better on a small probe, but exceeds pgvector's
        2,000-dimension limit for HNSW indexes. Usable only with exact search,
        which is fine at this corpus size but would not scale.

    "gemini:gemini-embedding-001":
      dimension: 1024
      request_dimensions: true
      notes: The previous generation. Also natively 3072 dimensions.
