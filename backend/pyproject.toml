[project]
name = "insightflow-backend"
version = "0.1.0"
description = "InsightFlow — agentic data analytics platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # ── Web layer ────────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.9",      # CSV upload (UploadFile)

    # ── Application database (our own metadata; see PROJECT_PLAN §10) ────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # ── Analytical connectors (customer data; see PROJECT_PLAN §9) ───────────
    "psycopg[binary]>=3.2.0",       # PostgresConnector (sync, run in a thread)
    "duckdb>=1.1.0",                # CSV → DuckDB

    # ── SQL safety (see PROJECT_PLAN §14) ────────────────────────────────────
    "sqlglot>=25.0.0",

    # ── LLM ──────────────────────────────────────────────────────────────────
    "openai>=1.60.0",               # used against any OpenAI-compatible provider
    "tenacity>=9.0.0",

    # ── Misc ─────────────────────────────────────────────────────────────────
    "cryptography>=43.0.0",         # Fernet, for datasource secrets
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Local embeddings pull in onnxruntime (~200 MB). They are only needed once the
# RAG layer exists, so they install separately:  uv sync --extra rag
# `app.rag.embeddings` defines the EmbeddingProvider interface regardless, so the
# seam is present even before the implementation is installed.
rag = [
    "fastembed>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "faker>=30.0.0",                # demo data generation
    "numpy>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]                   # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a live database (skipped when DATABASE_URL is unset)",
    "live_llm: calls a real LLM provider and consumes free-tier quota",
]
